name: keepalive
on:
  schedule:
    - cron: '17 21 * * *'      # 毎日 21:17 UTC（06:17 JST）。毎正時を避ける
  workflow_dispatch:           # 手動実行（受け入れ基準と、無効化からの復帰に使う）
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: call shared_material_ids
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"p_user":"00000000-0000-0000-0000-000000000000"}' \
            "$SUPABASE_URL/rest/v1/rpc/shared_material_ids")
          echo "http=$code"
          test "$code" = "200"
